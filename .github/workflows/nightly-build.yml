name: Nightly Build

# 触发：推代码时也同步+部署；每天 19:00 UTC = 次日 03:00 北京时间定时跑
# paths-ignore data/** 防止「提交 data/tasks.json」本身再次触发（死循环）
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch: {} # 手动触发，方便首次/调试

permissions:
  contents: write # 提交 data/tasks.json
  pages: write # 部署 GitHub Pages
  id-token: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # deploy-pages 要求 job 显式声明 github-pages 环境
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ---------- ① Claude Code 无头：连滴答 MCP，同步昨日数据 ----------
      # scripts/sync.mjs 会生成带真实令牌的临时 MCP 配置（--mcp-config），
      # 读取 prompts/sync-week.md 作为指令，跑完自动清理临时配置
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.223

      - name: Sync stats (Claude Code + Dida365 MCP)
        env:
          # Claude Code 走 DeepSeek 的 Anthropic 兼容端点
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_MODEL: deepseek-v4-flash
          ANTHROPIC_DEFAULT_SONNET_MODEL: deepseek-v4-flash
          ANTHROPIC_DEFAULT_OPUS_MODEL: deepseek-v4-flash
          ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-v4-flash
          DIDA_MCP_TOKEN: ${{ secrets.DIDA_MCP_TOKEN }}
        run: node scripts/sync.mjs
        # 同步失败不阻断构建：页面展示旧数据 + 上次同步时间
        continue-on-error: true

      # ---------- ② 校验并提交数据 ----------
      # tasks.json 损坏则回滚到上一个合法版本；无变化则跳过提交
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node -e "JSON.parse(require('fs').readFileSync('data/tasks.json','utf8'))" || git checkout -- data/tasks.json
          git add data/tasks.json
          git diff --cached --quiet && echo "no change" || {
            git commit -m "chore(data): sync $(TZ=Asia/Shanghai date +%F)"
            git push
          }

      # ---------- ③ 构建静态站 ----------
      # base 由 astro.config.mjs 依据 GITHUB_REPOSITORY 自动推导，无需传参
      - name: Build
        run: npm run build

      # ---------- ④ 部署 GitHub Pages ----------
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
